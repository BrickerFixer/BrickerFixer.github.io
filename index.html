<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinterMere</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #222;
    font: 12px Verdana, Geneva, Arial, sans-serif;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

#wrap {
    width: 100%;
    max-width: 760px;
    padding: 12px;
}

/* typography */

h1 {
    margin: 0 0 2px;
    font: 26px "Trebuchet MS", Arial, sans-serif;
    color: #4B0082;
}

a {
    color: #0000EE;
}

a:visited {
    color: #551A8B;
}

/* layout */

.row {
    display: flex;
    gap: 12px;
}

.half {
    width: 50%;
}

.grow {
    flex: 1;
}

.searchrow {
    align-items: center;
}

.searchrow iframe {
    border: none;
    width: 88px;
    height: 31px;
    flex-shrink: 0;
}

/* boxes */

.box h2 {
    margin: 0;
    padding: 4px 8px;
    background: #DDD;
    color: #333;
    font: bold 14px "Trebuchet MS", Arial, sans-serif;
}

.box .content {
    padding: 8px;
}

.box p {
    margin: 4px 0;
}

.box ul {
    margin: 0;
    padding-left: 18px;
}

/* search */

.searchbox {
    margin-left: 8px;
    background: #615770;
    padding: 4px;
}

.searchbox form {
    margin: 0;
    text-align: center;
}

.searchbox input[type="text"] {
    width: 300px;
    padding: 2px;
    font: 12px Verdana, Arial, sans-serif;
}

/* post-it */

.postit {
    padding: 10px;
    font-family: "Comic Sans MS", "Trebuchet MS", cursive, sans-serif;
}

.postit img {
    float: left;
    margin-right: 8px;
    width: 64px;
    height: 64px;
}

.postit h2 {
    margin: 0 0 6px;
    padding: 0;
    background: none;
    color: #6B5D00;
    font: bold 14px inherit;
}

.postit::after {
    content: "";
    display: block;
    clear: both;
}

.footer {
    margin-top: 12px;
    padding-top: 6px;
    border-top: 1px solid #CCC;
    text-align: center;
    color: #777;
    font-size: 10px;
}
</style>
</head>

<body>

<div id="wrap">

<header class="row">

<section class="half box">
<h2>News</h2>

<div class="content">
<ul>
<li><a href="#">This page is a stub and a demo.</a></li>
</ul>
</div>
</section>

<aside class="half postit">
<img src="/kawkaw_deltarune.png" alt="Placeholder">

<h2>WinterMere</h2>

<p>Welcome!</p>
</aside>

</header>

<br>

<section class="row searchrow">

<iframe src="/logo.html?ink=615770"></iframe>

<div class="grow searchbox">
<form action="#" method="get">
<input type="text" name="q" placeholder="Search...">
<button type="submit">Search</button>
</form>
</div>

</section>

<br>

<main class="row">

<section class="grow box">

<h2>Services</h2>

<div class="content">
<img src="/kawkaw_deltarune.png" alt="Placeholder">
</div>

</section>

<section class="grow box">

<h2>Page Index</h2>

<div class="content">

<p>There are still no places to get you started! Maybe you can help by adding some?</p>

<p>
<a href="#">Submit your site &raquo;</a>
</p>

</div>

</section>

</main>

</div>

</body>
</html>
