<!DOCTYPE html>
<head>
    <title>To-do list</title>
    <style>
        .done {
            text-decoration: line-through solid black 1px;
        }
        .note {
            width: 320px;
            background: lightgoldenrodyellow;
            font-family: "Segoe Script", "Comic Sans", sans-serif;
            aspect-ratio: 1/1;
            box-shadow: 0 16px 16px 0 #00000050;
            justify-self: center;
        }
        .inputtable {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            height: 32px;
            gap: 16px;
            opacity: 0;
        }
        .inputtable button {
            background: none;
            border: none;
        }
        .inputtable input {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid #00000050;
            outline: none;
        }
        .inputtable:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="note">
    <div class="inputtable">
        <input>
        <button>Add</button>
    </div>
    <ul>

    </ul>
</div>

    <script>
        // adding a variable array
        var todo = [];

        // tying the html to js
        const addbtn = document.querySelector("button");
        const input = document.querySelector("input");
        const list = document.querySelector("ul");
        const header = document.querySelector("h1");
        var tasks = document.querySelectorAll("li");

        // adding onclick listener
        addbtn.addEventListener("click", () => {
            if(input.value != "") {
                todo.push(input.value); // we get inner value using input.value, as the text inside is not in html
                list.innerHTML = todo.map((x) => { // here we map the values from the array to the html
                    return `<li>${ x }</li>`; // in the end we get an array ["<li>hello</li>", "<li>World</li>"];
                }).join(''); // and turn it into a string
                
                tasks = document.querySelectorAll("li"); // we refresh the list of items
                tasks.forEach((item) => {
                    item.remove
                    item.addEventListener("click", toggleDone); // ... and then we add the click listeners to all the items
                });
            }
        });
        function toggleDone(e) {
            if (!e.target.className) {
                e.target.className = "done";
            } else {
                e.target.className = "";
            }
        }



    </script>
</body>
