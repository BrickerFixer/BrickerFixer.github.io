<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffuru's cozy corner!</title>
    <style>
        @font-face {
            font-family: 'ComicMono';
            src: url('ComicMono.ttf');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f1c29;
            user-select: none;
            transition: background-color 0.5s;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 28, 41, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #d6336c;
            font-family: 'ComicMono', 'Courier New', monospace;
            z-index: 10;
            cursor: pointer;
            text-align: center;
        }
        
        #overlay h1 { margin-bottom: 10px; font-size: 20px; text-transform: uppercase; letter-spacing: 2px;}
        #overlay p { font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>The system is currently off...</h1>
        <p>Touch to Power On</p>
    </div>
    <canvas id="stage"></canvas>

<script>
    /** 
     * CONFIGURATION
     */
    const FPS = 16;
    const FRAME_DURATION = 1000 / FPS;
    
    // Palettes
    const PALETTES = {
        dark: {
            bg: '#0f1c29',        
            surface: '#1a2e40',   
            accent: '#d6336c',    
            highlight: '#ff6b9d', 
            text: '#ffffff',      
            muted: '#94a3b8',     
            grid: 'rgba(148, 163, 184, 0.05)',
            barText: '#ffffff',
            scrollBar: '#2d3436'
        },
        light: {
            bg: '#f4f4f9',        
            surface: '#ffffff',   
            accent: '#d6336c',    
            highlight: '#ffeaa7', 
            text: '#2d3436',      
            muted: '#636e72',     
            grid: 'rgba(0, 0, 0, 0.05)',
            barText: '#ffffff',
            scrollBar: '#dfe6e9'
        }
    };

    let COLORS = PALETTES.dark; 

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const overlay = document.getElementById('overlay');

    let width, height;
    let lastTime = 0;
    let isRunning = false;
    let isMuted = false;
    let themeMode = 'dark';
    let currentView = 'home'; 
    
    // Scroll State
    let scrollY = 0;
    let maxScroll = 0;
    
    // Character Animation State
    let charYOffset = 500; // Start off-screen
    const charImg = new Image();
    charImg.src = 'character.png'; // Make sure this file exists!

    // Audio
    const audio = {
        bgm: new Audio('WaterIsSink.mp3'),
        press: new Audio('press.mp3'),
        set: new Audio('set.mp3'),
        back: new Audio('back.mp3')
    };
    
    audio.bgm.loop = true;
    audio.bgm.volume = 0.4;

    function playSfx(name) {
        if(isMuted) return;
        audio[name].currentTime = 0;
        audio[name].play().catch(() => {});
    }

    // Mouse
    const mouse = { x: -100, y: -100, click: false, down: false };

    // Animation State
    let bobTime = 0;

    // Layout Constants
    const MENU_W = 320;
    const ROW_H = 70;
    const BAR_H = 36; 

    /**
     * CONTENT DATA (The Articles)
     */
    const ARTICLES = {
        'projects': {
            title: "Projects",
            content: `
# LUMEN (IN DEVELOPMENT)
> JAVASCRIPT+PYTHON, NODEJS+CATBOOST, 2024-2025

A decentralized (in theory) search engine toolkit with a neural ranking engine plugged on top of it, with a python API that runs off of yandex's catboost for quality ranking and MiniLM for semantic ranking based on query context.
Contains UX experiments like Islands - interactive snippets that contextually pop up upon search for an interactive visual presentation of facts.
Segregation of information sources for factual information also helps with better searches, as we get multiple search engines and sources for proofreading in stock setup.
Embeddability provides people that use the search engine with information that's relevant to their organization or home, because they can just selfhost one of the nodes and put their own information retrieval methods there, freely.
Finally, we're a community, so you can help us by contributing to the source code, making your own search doodles (for putting them on a homepage), making your own Islands and search methods... Or just fork all that and make your own, better version of it!

---

# TURNABLE
> JAVA+KOTLIN, ANDROID, 2022-2023

The project made for decentralizing music streaming by playing HLS streams from all around the internet. It didn't take off, really.
            `
        },
        'about': {
            title: "User Profile",
            content: `
# IDENTITY
Name: Waffuru
Role: silly fop
Level: 17

# BIO
I am kind of a developer and a wannabe designer that loves the aesthetic of old technology. I believe that back then, everything was designed with the user in mind.

My favorite era of computing is the early to mid 2000s, where interfaces were experimental, tactile, full of quirks and personality.

# SKILLS
- Javascript / Python / partially Java and Kotlin
- Retro Hardware
- Creative (but sometimes not really usable) UI / UX Design
            `
        },
        'links': {
            title: "Internet connections",
            content: `
# GITHUB
https://github.com/BrickerFixer

# DISCORD
@waffuru.rs

# EMAIL
brickerfixer@gmail.com

---

> Please insert WiFi Card to access external networks.
            `
        },
        'archive': {
            title: "Additional things!",
            content: `
# This is reserved for the future, so you can probably wait for something more!
            `
        }
    };

    // Home Menu Tiles
    const tiles = [
        { id: 'projects', label: "PROJECT CARTRIDGE", x: 0, y: 0, w: MENU_W, h: ROW_H },
        { id: 'about',    label: "ABOUT ME", x: 0, y: ROW_H, w: MENU_W/2, h: ROW_H },
        { id: 'links',    label: "LINKS", x: MENU_W/2, y: ROW_H, w: MENU_W/2, h: ROW_H },
        { id: 'archive',  label: "ARCHIVE PAK", x: 0, y: ROW_H*2, w: MENU_W, h: ROW_H }
    ];

    const sysButtons = [
        { id: 'mute', icon: 'speaker', x: 0, y: 0 },
        { id: 'theme', icon: 'bulb', x: 0, y: 0 },
        { id: 'nav', icon: 'old', x: 0, y: 0 } 
    ];

    /**
     * INITIALIZATION
     */
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        let startX = width - 40;
        let startY = height - 40;
        sysButtons.forEach((btn, i) => {
            btn.x = startX - (i * 45); 
            btn.y = startY;
        });
    }

    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });
    window.addEventListener('mousedown', () => {
        mouse.click = true;
        mouse.down = true;
    });
    window.addEventListener('mouseup', () => mouse.down = false);
    
    // Scrolling Logic
    window.addEventListener('wheel', e => {
        if(currentView !== 'home') {
            scrollY -= e.deltaY;
            // Clamp scroll
            if(scrollY > 0) scrollY = 0;
            if(scrollY < -maxScroll) scrollY = -maxScroll;
        }
    });

    overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
        isRunning = true;
        audio.bgm.play().catch(e => console.log("Audio play blocked"));
        animate(0);
    });

    /**
     * MAIN LOOP
     */
    function animate(timestamp) {
        requestAnimationFrame(animate);

        const elapsed = timestamp - lastTime;
        if (elapsed < FRAME_DURATION) return;
        lastTime = timestamp - (elapsed % FRAME_DURATION);

        // Update Logic
        bobTime += 0.04; 
        const bobOffset = Math.sin(bobTime) * 6; 
        
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, width, height);

        drawBigSlowGrid(timestamp);

        // Draw Content Layers
        if (currentView === 'home') {
            drawMenu(bobOffset);
        } else {
            drawReader(currentView, bobOffset);
        }

        // Draw Character (Peeking Logic)
        drawCharacter();

        // UI Layers (On top)
        drawStatusBar(); 
        drawSystemButtons();
        
        mouse.click = false;
    }

    /**
     * DRAWING FUNCTIONS
     */

    function drawCharacter() {
        if (!charImg.complete) return;

        // Target: 0 (visible) if about, 300 (hidden) if not
        const targetOffset = (currentView === 'about') ? 0 : 400;
        
        // Smooth slide (Lerp)
        charYOffset += (targetOffset - charYOffset) * 0.1;

        // If completely off screen, don't draw
        if (charYOffset > 390) return;

        // Scale image to a reasonable size
        const scale = 250 / charImg.height; // Height target 250px
        const drawW = charImg.width * scale;
        const drawH = charImg.height * scale;
        
        // Position: Bottom Left
        const drawX = -10; // Slight nudge left
        const drawY = height - drawH + charYOffset;

        ctx.drawImage(charImg, drawX, drawY, drawW, drawH);
    }

    function drawBigSlowGrid(time) {
        ctx.beginPath();
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 2;
        const gridSize = 150; 
        const speed = 0.005; 
        const offsetX = (time * speed) % gridSize;
        const offsetY = (time * speed) % gridSize;

        for(let x = -gridSize + offsetX; x < width; x += gridSize) {
            ctx.moveTo(x, 0); ctx.lineTo(x, height);
        }
        for(let y = -gridSize + offsetY; y < height; y += gridSize) {
            ctx.moveTo(0, y); ctx.lineTo(width, y);
        }
        ctx.stroke();
    }

    function drawStatusBar() {
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
        ctx.fillStyle = COLORS.accent; 
        ctx.fillRect(0, 0, width, BAR_H);
        ctx.shadowColor = "transparent"; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

        ctx.font = "12px 'ComicMono', monospace";
        ctx.textBaseline = "middle";
        let rx = width - 15;
        
        drawPixelIcon(ctx, 'battery', rx - 25, BAR_H/2, COLORS.barText); rx -= 35;
        drawPixelIcon(ctx, 'signal', rx - 20, BAR_H/2, COLORS.barText); rx -= 30;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const dateStr = now.toLocaleDateString([], {month: 'numeric', day: 'numeric'});
        
        ctx.textAlign = "right";
        ctx.fillStyle = COLORS.barText;
        ctx.fillText(`${dateStr}  ${timeStr}`, rx, BAR_H/2);
        
        ctx.textAlign = "left";
        ctx.font = "bold 12px 'ComicMono', monospace";
        let title = "Waffuru";
        if (currentView !== 'home') title = `READ: /${ARTICLES[currentView].title}`;
        ctx.fillText(title, 15, BAR_H/2);
    }

    function drawMenu(bobOffset) {
        const startX = (width - MENU_W) / 2;
        const startY = ((height - (ROW_H * 3)) / 2) + bobOffset;

        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(startX + 8, startY + 8, MENU_W, ROW_H * 3);
        ctx.lineWidth = 2; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "14px 'ComicMono', monospace";

        tiles.forEach(tile => {
            const absX = startX + tile.x;
            const absY = startY + tile.y;
            const isHovered = (mouse.x >= absX && mouse.x <= absX + tile.w && mouse.y >= absY && mouse.y <= absY + tile.h);

            if(isHovered && mouse.click) {
                playSfx('press');
                currentView = tile.id;
                scrollY = 0; // Reset scroll on entry
            }

            ctx.fillStyle = isHovered ? COLORS.highlight : COLORS.surface;
            ctx.fillRect(absX, absY, tile.w, tile.h);
            ctx.strokeStyle = COLORS.bg; ctx.strokeRect(absX, absY, tile.w, tile.h);

            if (isHovered) {
                ctx.strokeStyle = (themeMode === 'light') ? '#ff9f43' : COLORS.text; 
                ctx.setLineDash([4, 4]); 
                ctx.strokeRect(absX + 4, absY + 4, tile.w - 8, tile.h - 8);
                ctx.setLineDash([]); 
            }

            ctx.fillStyle = isHovered ? COLORS.text : COLORS.muted;
            if(themeMode === 'light' && isHovered) ctx.fillStyle = '#2d3436';
            ctx.fillText(tile.label, absX + tile.w/2, absY + tile.h/2);
        });
    }

    function drawReader(viewType, bobOffset) {
        const article = ARTICLES[viewType];
        
        // Reader Container
        const containerH = ROW_H * 5; // Taller view
        const startX = (width - MENU_W) / 2;
        const startY = ((height - containerH) / 2) + bobOffset;

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(startX + 8, startY + 8, MENU_W, containerH);

        // Main Surface
        ctx.fillStyle = COLORS.surface;
        ctx.fillRect(startX, startY, MENU_W, containerH);

        // Clipping Region (Screen Bounds)
        ctx.save();
        ctx.beginPath();
        ctx.rect(startX, startY, MENU_W, containerH);
        ctx.clip();

        // -- DRAW CONTENT INSIDE CLIP --
        
        // Calculate Content Height dynamically
        let drawY = startY + 20 + scrollY;
        const pad = 20;
        const contentWidth = MENU_W - 50; // Leave room for scrollbar

        // Title
        ctx.fillStyle = COLORS.accent;
        ctx.font = "bold 18px 'ComicMono', monospace";
        ctx.textAlign = "left";
        ctx.fillText(article.title, startX + pad, drawY);
        drawY += 30;

        // Divider
        ctx.fillStyle = COLORS.muted;
        ctx.fillRect(startX + pad, drawY, contentWidth, 2);
        drawY += 20;

        // Body Text
        ctx.font = "12px 'ComicMono', monospace";
        ctx.fillStyle = COLORS.text;
        if(themeMode === 'light') ctx.fillStyle = '#333';
        
        // Parse and Wrap Text
        const lines = article.content.split('\n');
        
        lines.forEach(line => {
            line = line.trim();
            if(line.startsWith('# ')) {
                // Header style
                drawY += 10;
                ctx.font = "bold 14px 'ComicMono', monospace";
                ctx.fillStyle = COLORS.highlight;
                if(themeMode === 'light') ctx.fillStyle = COLORS.accent;
                drawY = wrapText(ctx, line.substring(2), startX + pad, drawY, contentWidth, 20);
                // Reset font
                ctx.font = "12px 'ComicMono', monospace";
                ctx.fillStyle = (themeMode === 'light') ? '#333' : COLORS.text;
            } 
            else if (line.startsWith('> ')) {
                // Quote style
                ctx.fillStyle = COLORS.muted;
                ctx.font = "italic 12px 'ComicMono', monospace";
                drawY = wrapText(ctx, line, startX + pad + 10, drawY, contentWidth - 10, 16);
                ctx.font = "12px 'ComicMono', monospace";
                ctx.fillStyle = (themeMode === 'light') ? '#333' : COLORS.text;
                drawY += 5;
            }
            else if (line === '---') {
                // HR
                drawY += 10;
                ctx.fillStyle = COLORS.grid; // Faint line
                ctx.fillRect(startX + pad + 10, drawY, contentWidth - 20, 1);
                ctx.fillStyle = (themeMode === 'light') ? '#333' : COLORS.text;
                drawY += 20;
            }
            else if (line.length > 0) {
                // Normal paragraph
                drawY = wrapText(ctx, line, startX + pad, drawY, contentWidth, 16);
                drawY += 5; // Paragraph spacing
            } else {
                drawY += 10; // Empty line spacing
            }
        });

        // Calculate total content height for scrolling limits
        const contentTotalHeight = drawY - (startY + 20 + scrollY);
        maxScroll = Math.max(0, contentTotalHeight - (containerH - 40));

        ctx.restore(); // Remove Clip

        // -- DRAW SCROLLBAR UI (Overlay) --
        
        // Scroll Track
        const trackX = startX + MENU_W - 15;
        const trackH = containerH - 10;
        ctx.fillStyle = COLORS.grid;
        ctx.fillRect(trackX, startY + 5, 10, trackH);

        // Scroll Handle
        let handleH = (containerH / contentTotalHeight) * trackH;
        if (handleH > trackH) handleH = trackH;
        if (handleH < 20) handleH = 20; // Min size

        // Map scrollY to handle position
        // pct = scrollY / maxScroll (0 to -1)
        let pct = Math.abs(scrollY) / maxScroll;
        if(maxScroll === 0) pct = 0;
        
        let handleY = startY + 5 + (pct * (trackH - handleH));

        ctx.fillStyle = COLORS.accent;
        ctx.fillRect(trackX, handleY, 10, handleH);

        // Border Reader
        ctx.lineWidth = 2;
        ctx.strokeStyle = COLORS.muted;
        ctx.strokeRect(startX, startY, MENU_W, containerH);
    }

    // Helper: Wrap Text
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        let words = text.split(' ');
        let line = '';

        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = context.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                context.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            }
            else {
                line = testLine;
            }
        }
        context.fillText(line, x, y);
        return y + lineHeight;
    }

    function drawSystemButtons() {
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        sysButtons.forEach(btn => {
            const size = 32;
            const drawX = btn.x - size/2;
            const drawY = btn.y - size/2;

            const isHovered = (
                mouse.x >= drawX && mouse.x <= drawX + size &&
                mouse.y >= drawY && mouse.y <= drawY + size
            );

            ctx.fillStyle = isHovered ? COLORS.highlight : COLORS.surface;
            ctx.fillRect(drawX, drawY, size, size);
            ctx.strokeStyle = COLORS.muted;
            ctx.lineWidth = 1;
            ctx.strokeRect(drawX, drawY, size, size);

            let iconType = btn.icon;
            if (btn.id === 'nav') iconType = (currentView === 'home') ? 'old' : 'back';

            const iconColor = (isHovered && themeMode==='light') ? '#333' : (isHovered ? '#fff' : COLORS.muted);
            drawPixelIcon(ctx, iconType, btn.x, btn.y, iconColor);

            if (isHovered && mouse.click) {
                if(btn.id === 'mute') {
                    isMuted = !isMuted;
                    audio.bgm.muted = isMuted;
                    playSfx('set');
                } 
                else if(btn.id === 'theme') {
                    themeMode = (themeMode === 'dark') ? 'light' : 'dark';
                    COLORS = PALETTES[themeMode];
                    document.body.style.backgroundColor = COLORS.bg;
                    playSfx('set');
                } 
                else if(btn.id === 'nav') {
                    if (currentView !== 'home') {
                        currentView = 'home';
                        playSfx('back');
                    } else {
                        playSfx('set');
                        alert("System is operating at peak efficiency.");
                    }
                }
            }
        });
    }

    function drawPixelIcon(c, type, x, y, color) {
        c.fillStyle = color;
        c.strokeStyle = color;
        x = Math.floor(x); y = Math.floor(y);

        if (type === 'battery') {
            c.lineWidth = 2; c.strokeRect(x, y - 6, 20, 12); c.fillRect(x + 22, y - 3, 2, 6);
            c.fillStyle = '#00b894'; c.fillRect(x + 3, y - 3, 4, 6); c.fillRect(x + 8, y - 3, 4, 6); c.fillRect(x + 13, y - 3, 4, 6);
        }
        else if (type === 'signal') {
            c.fillRect(x, y + 4, 3, 4); c.fillRect(x + 5, y + 1, 3, 7);
            c.fillRect(x + 10, y - 2, 3, 10); c.globalAlpha = 0.3; c.fillRect(x + 15, y - 5, 3, 13); c.globalAlpha = 1.0;
        }
        else if (type === 'speaker') {
            c.beginPath(); c.moveTo(x-4, y-3); c.lineTo(x, y-3); c.lineTo(x+4, y-7);
            c.lineTo(x+4, y+7); c.lineTo(x, y+3); c.lineTo(x-4, y+3); c.fill();
            if (!isMuted) { c.fillRect(x+6, y-2, 2, 2); c.fillRect(x+8, y-4, 2, 2); c.fillRect(x+6, y+2, 2, 2); c.fillRect(x+8, y+4, 2, 2);
            } else { c.strokeStyle = color; c.lineWidth = 2; c.beginPath(); c.moveTo(x+6, y-3); c.lineTo(x+10, y+3); c.moveTo(x+10, y-3); c.lineTo(x+6, y+3); c.stroke(); }
        }
        else if (type === 'bulb') {
            c.lineWidth = 2; c.beginPath(); c.arc(x, y-2, 4, 0, Math.PI*2); c.stroke();
            c.fillRect(x-2, y+3, 4, 3);
            if (themeMode === 'light') { c.fillStyle = color; c.fill(); }
        }
        else if (type === 'back') {
            c.fillRect(x-4, y-1, 8, 2); c.fillRect(x-4, y-2, 2, 1); c.fillRect(x-4, y+1, 2, 1); c.fillRect(x-6, y-1, 2, 2);
        }
        else if (type === 'old') {
            c.strokeRect(x-6, y-6, 12, 12); c.fillRect(x-4, y-6, 4, 3); c.fillRect(x-4, y+2, 8, 4);
        }
    }

</script>
</body>
</html>
