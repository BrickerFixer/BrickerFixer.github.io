<!DOCTYPE html>
<html>
<head>
    <title>For loops</title>
</head>
<body>
    <p></p>
    <button>See what this does</button>
    <script>
        const story = "All work and no play makes Jack a dull boy.\n";
        const text = document.querySelector("p");
        const starter = document.querySelector("button");

        starter.addEventListener("click", () => {
            for(i=0;i!=story.length;i++) {
                appendonemore(i);
            }
        });

        function appendonemore(i){
            setTimeout(function() {
                text.textContent += story[i];
            }, 10*i)
        }
    </script>
</body>
</html>
